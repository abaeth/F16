<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <title>abae</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="abae">
  <meta name="theme-color" content="#f2f2f7">

  <meta property="og:title" content="abae">
  <meta property="og:site_name" content="abae">

  <!-- ดึงไฟล์ logo.png และ manifest.json จาก GitHub -->
  <link rel="apple-touch-icon" href="./logo.png">
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="manifest" href="./manifest.json">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background-color: #f2f2f7;
      overflow: hidden;
      font-family: -apple-system, Roboto, sans-serif;
    }
    iframe { width: 100% !important; height: 100% !important; border: none !important; display: block !important; }
  </style>
</head>
<body>

  <iframe id="app-frame" allow="autoplay; camera; fullscreen"></iframe>

  <script>
    // 👇 ลิงก์ของแอปหลัก (Hub) ถูกต้องแล้ว
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyVZp09oHsU62CZvJVBBeEnOLtQrW3t8Ngxe3IFG-T90_AhoM-0UixTUW3dgmBSRdI1/exec";

    document.title = "abae";
    setInterval(function() { document.title = "abae"; }, 1000);

    let savedBranch = localStorage.getItem('hub_branch') || '';
    let savedShop = localStorage.getItem('hub_shop') || '';
    let savedStaff = localStorage.getItem('hub_staff') || '';
    let savedReg = localStorage.getItem('hub_reg') || '';

    let finalUrl = GAS_URL + "?v=" + Date.now();
    if (savedBranch) finalUrl += "&branch=" + encodeURIComponent(savedBranch);
    if (savedShop) finalUrl += "&shop=" + encodeURIComponent(savedShop);
    if (savedStaff) finalUrl += "&staff=" + encodeURIComponent(savedStaff);
    if (savedReg) finalUrl += "&reg=" + encodeURIComponent(savedReg);

    document.getElementById('app-frame').src = finalUrl;

    window.addEventListener('message', function(event) {
      if (event.data) {
        if (event.data.action === 'save_all') {
          localStorage.setItem('hub_branch', event.data.branch);
          localStorage.setItem('hub_shop', event.data.shop);
          localStorage.setItem('hub_staff', event.data.staff);
          localStorage.setItem('hub_reg', 'true');
        } else if (event.data.action === 'logout_staff') {
          localStorage.removeItem('hub_staff');
        }
      }
    });
  </script>
</body>
</html>
