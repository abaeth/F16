<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <title>abae</title>

  <!-- 📱 บังคับให้เป็น App เต็มจอ (Standalone) บน iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="abae">
  <meta name="theme-color" content="#f2f2f7">

  <meta property="og:title" content="abae">
  <meta property="og:site_name" content="abae">

  <!-- 🚀 ดึงไฟล์โลโก้และไฟล์ตั้งค่า PWA -->
  <link rel="apple-touch-icon" href="./logo.png">
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="manifest" href="./manifest.json">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background-color: #f2f2f7;
      overflow: hidden;
      font-family: -apple-system, Roboto, sans-serif;
    }
    iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      display: block !important;
    }
  </style>
</head>
<body>

  <iframe id="app-frame" allow="autoplay; camera; fullscreen"></iframe>

  <script>
    const GAS_EXEC_URL = "https://script.google.com/macros/s/AKfycby-ApQEa-dgWIjg0KLVhQXV3PNVDk_flR4QeQgQiAenW7xoPe75M_HJhMPdj9gGftp0xg/exec";

    // 🔒 ล็อคชื่อ Title บนเบราว์เซอร์
    document.title = "abae";
    setInterval(function() {
      document.title = "abae";
    }, 1000);

    window.onload = function() {
      loadApp();
    };

    function loadApp() {
      let savedBranch = localStorage.getItem("f16_device_branch");
      let savedStaff = localStorage.getItem("f16_device_staff");

      let targetUrl = GAS_EXEC_URL;
      let connector = targetUrl.includes('?') ? '&' : '?';

      if (savedBranch) {
        targetUrl += connector + "reg=true&branch=" + encodeURIComponent(savedBranch);
        if (savedStaff) {
          targetUrl += "&staff=" + encodeURIComponent(savedStaff);
        }
      }

      let cacheConnector = targetUrl.includes('?') ? '&' : '?';
      document.getElementById("app-frame").src = targetUrl + cacheConnector + "_nocache=" + Date.now();
    }

    window.addEventListener("message", function(event) {
      if (event.data && event.data.action) {
        if (event.data.action === "save_all") {
          if (event.data.branch) localStorage.setItem("f16_device_branch", event.data.branch);
          if (event.data.staff) localStorage.setItem("f16_device_staff", event.data.staff);
        } else if (event.data.action === "logout_staff") {
          localStorage.removeItem("f16_device_staff");
          loadApp();
        }
      }
    });
  </script>
</body>
</html>
