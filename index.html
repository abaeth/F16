<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <title>แอ๊บแอ้</title>

  <!-- 🇹🇭 Open Graph สำหรับ iOS Share Sheet -->
  <meta property="og:title" content="แอ๊บแอ้">
  <meta property="og:site_name" content="แอ๊บแอ้">
  <meta name="title" content="แอ๊บแอ้">

  <!-- 📱 บังคับโหมด Web App เต็มจอ -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- 🍎 ชื่อบน iOS (iPhone/iPad) ตอน Add to Home Screen -->
  <meta name="apple-mobile-web-app-title" content="แอ๊บแอ้">
  <meta name="theme-color" content="#f2f2f7">

  <!-- 🚀 1. ดึงไฟล์ภาพ PNG ของจริงมาทำโลโก้ Add to Home Screen (ต้องมีไฟล์ logo.png ใน GitHub) -->
  <link rel="apple-touch-icon" sizes="180x180" href="./logo.png?v=3">

  <!-- 🤖 2. Favicon & Manifest สำหรับเบราว์เซอร์ปกติและ Android -->
  <link rel="icon" type="image/png" href="./logo.png?v=3">
  
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%E0%B9%81%E0%B8%AD%E0%B9%8A%E0%B8%9A%E0%B9%81%E0%B8%AD%E0%B9%89%22%2C%22short_name%22%3A%22%E0%B9%81%E0%B8%AD%E0%B9%8A%E0%B8%9A%E0%B9%81%E0%B8%AD%E0%B9%89%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f2f2f7%22%2C%22theme_color%22%3A%22%23ff007f%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22.%2Flogo.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background-color: #f2f2f7;
      overflow: hidden;
      font-family: -apple-system, Roboto, sans-serif;
    }
    iframe {
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      display: block !important;
    }
  </style>
</head>
<body>

  <iframe id="app-frame" allow="autoplay; camera; focus-without-user-activation"></iframe>

  <script>
    const GAS_EXEC_URL = "https://script.google.com/macros/s/AKfycby-ApQEa-dgWIjg0KLVhQXV3PNVDk_flR4QeQgQiAenW7xoPe75M_HJhMPdj9gGftp0xg/exec";

    // 🔒 ล็อคชื่อ Title บนเบราว์เซอร์
    document.title = "แอ๊บแอ้";
    setInterval(function() {
      document.title = "แอ๊บแอ้";
    }, 1000);

    window.onload = function() {
      loadApp();
    };

    function loadApp() {
      let savedBranch = localStorage.getItem("f16_device_branch");
      let savedStaff = localStorage.getItem("f16_device_staff");

      let targetUrl = GAS_EXEC_URL;
      let connector = targetUrl.includes('?') ? '&' : '?';

      if (savedBranch) {
        targetUrl += connector + "reg=true&branch=" + encodeURIComponent(savedBranch);
        if (savedStaff) {
          targetUrl += "&staff=" + encodeURIComponent(savedStaff);
        }
      }

      let cacheConnector = targetUrl.includes('?') ? '&' : '?';
      document.getElementById("app-frame").src = targetUrl + cacheConnector + "_nocache=" + Date.now();
    }

    window.addEventListener("message", function(event) {
      if (event.data && event.data.action) {
        if (event.data.action === "save_all") {
          if (event.data.branch) localStorage.setItem("f16_device_branch", event.data.branch);
          if (event.data.staff) localStorage.setItem("f16_device_staff", event.data.staff);
        } else if (event.data.action === "logout_staff") {
          localStorage.removeItem("f16_device_staff");
          loadApp();
        }
      }
    });
  </script>
</body>
</html>
